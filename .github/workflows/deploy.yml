name: Deploy

on:
  push:
    branches:
      - deploy
  workflow_dispatch:
  repository_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  deploy:
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - run: corepack yarn install --frozen-lockfile

    - run: corepack yarn build
      env:
        NODE_ENV: production
        CONFIG_PATH: ./config.yaml
        NODE_OPTIONS: --openssl-legacy-provider

    - run: ./node_modules/.bin/webpack --config node_modules/flareact/configs/webpack.worker.config.js --mode production
      env:
        NODE_ENV: production
        NODE_OPTIONS: --openssl-legacy-provider

    - run: npm install -g wrangler@4.98.0

    - name: Prepare Wrangler
      run: bash ./scripts/prepare-wrangler.sh
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    - name: Sync Worker secrets
      run: |
        if [ -n "${SECRET_SLACK_WEBHOOK_URL:-}" ]; then
          printf '%s' "${SECRET_SLACK_WEBHOOK_URL}" | wrangler secret put SECRET_SLACK_WEBHOOK_URL --env production
        fi
        if [ -n "${SECRET_TELEGRAM_API_TOKEN:-}" ]; then
          printf '%s' "${SECRET_TELEGRAM_API_TOKEN}" | wrangler secret put SECRET_TELEGRAM_API_TOKEN --env production
        fi
        if [ -n "${SECRET_TELEGRAM_CHAT_ID:-}" ]; then
          printf '%s' "${SECRET_TELEGRAM_CHAT_ID}" | wrangler secret put SECRET_TELEGRAM_CHAT_ID --env production
        fi
        if [ -n "${SECRET_DISCORD_WEBHOOK_URL:-}" ]; then
          printf '%s' "${SECRET_DISCORD_WEBHOOK_URL}" | wrangler secret put SECRET_DISCORD_WEBHOOK_URL --env production
        fi
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        SECRET_SLACK_WEBHOOK_URL: ${{ secrets.SECRET_SLACK_WEBHOOK_URL }}
        SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN }}
        SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID }}
        SECRET_DISCORD_WEBHOOK_URL: ${{ secrets.SECRET_DISCORD_WEBHOOK_URL }}

    - name: Publish
      run: wrangler deploy --env production --no-bundle
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    - name: KV GC
      run: corepack yarn kv-gc
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        KV_NAMESPACE_ID: ${{ env.KV_NAMESPACE_ID }}
