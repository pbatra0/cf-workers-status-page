name = "cf-workers-status-page"
main = "dist/main.js"
workers_dev = true
compatibility_date = "2021-07-23"

[triggers]
crons = ["*/2 * * * *"]

[site]
bucket = "./out"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# GitHub Actions injects the production KV namespace binding during deploy.
